name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Установить зависимости
        # --frozen: лок должен быть актуален, а не молча пересобираться в CI.
        run: uv sync --frozen

      - name: Формат
        run: uv run ruff format --check .

      - name: Линт
        run: uv run ruff check .

      - name: Тесты
        run: uv run pytest -q
