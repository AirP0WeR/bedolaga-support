version: 2

updates:
  # Python: pyproject.toml + uv.lock. Экосистема uv умеет обновлять именно лок,
  # тем же резолвом, что и `uv lock --upgrade` локально.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    # Свежий релиз в PyPI часто откатывают через день-другой. Ждём, пока
    # версия отлежится, мажоры — дольше.
    cooldown:
      default-days: 5
      semver-major-days: 14
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    labels:
      - dependencies
    groups:
      # Мелочь — одним PR: 4 рантайм-зависимости и 3 dev'ные не стоят
      # семи отдельных веток в неделю.
      python-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Мажоры приходят отдельными PR — их надо смотреть глазами.

  # Экшены в .github/workflows (directory всегда «/», путь Dependabot знает сам).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'

  # Базовый образ Dockerfile (python:3.12-slim). Мажоры Python не тянем
  # автоматически: смена рантайма — осознанное решение, а не апдейт.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: docker
    labels:
      - dependencies
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major

# docker-compose.yml намеренно не подключён: там единственный образ —
# наш собственный ghcr.io/airp0wer/bedolaga-support, его версию двигает
# релизный workflow, а не Dependabot.
