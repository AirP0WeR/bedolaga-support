services:
  support-ai:
    # На сервере тянем готовый образ из GHCR, локально можно собрать:
    #   docker compose build
    image: ${IMAGE:-ghcr.io/airp0wer/bedolaga-support:latest}
    build: .
    container_name: bedolaga-support
    restart: unless-stopped
    env_file: .env
    # Обращение к модели идёт до 120 с. Дефолтные 10 с гарантируют SIGKILL
    # посреди обработки тикета — ровно там, где нельзя.
    stop_grace_period: 150s
    volumes:
      # Состояние переживает пересоздание контейнера. Без этого сервис
      # забудет, что уже отвечал и что уже эскалировал.
      # Каталог на хосте должен принадлежать uid 1000 — под ним работает
      # контейнер: mkdir -p data && chown 1000:1000 data
      - ./data:/data
      # База знаний правится без пересборки образа.
      - ./kb:/srv/kb:ro
    networks:
      - bot
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  # Сеть, в которой живёт контейнер бедолаги. Имя смотрится на сервере:
  #   docker inspect <контейнер_бота> -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
  bot:
    external: true
    name: ${BOT_NETWORK:-remnawave-bot_default}
