services:
  support-ai:
    # На сервере тянем готовый образ из GHCR, локально можно собрать:
    #   docker compose build
    image: ${IMAGE:-ghcr.io/airp0wer/bedolada-support:latest}
    build: .
    container_name: bedolada-support
    restart: unless-stopped
    env_file: .env
    volumes:
      # Состояние переживает пересоздание контейнера. Без этого сервис
      # забудет, что уже отвечал и что уже эскалировал.
      - ./data:/data
      # База знаний правится без пересборки образа.
      - ./kb:/srv/kb:ro
    networks:
      - bot
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  # Сеть, в которой живёт контейнер бедолаги. Имя смотрится на сервере:
  #   docker inspect <контейнер_бота> -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
  bot:
    external: true
    name: ${BOT_NETWORK:-remnawave-bot_default}
