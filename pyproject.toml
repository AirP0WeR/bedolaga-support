[project]
name = "bedolaga-support"
version = "0.2.2"
description = "ИИ-автоответчик на тикеты встроенной поддержки бота bedolaga"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.60",
    # Базы часовых поясов в slim-образе нет, а zoneinfo нужен для API_TZ.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Только для scripts/smoke_vision.py: рисует картинку для проверки vision.
    "pillow>=10.0",
]

[tool.uv]
# Проект — не библиотека: устанавливать в venv нечего, нужны только зависимости.
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
# В docs/ лежат спеки и планы с иллюстративными кусками кода: там методы класса
# показаны в отрыве от класса, и форматтер честно снимает у них отступ, ломая
# смысл. Документы — не исходники, ruff их не касается.
extend-exclude = ["docs"]

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Кириллица в идентификаторах тестов — осознанно: имена тестов читаются
    # как описание правила.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Скрипты ручной проверки моделей запускаются из каталога scripts/ и должны
# сначала добавить корень репозитория в путь, а уже потом импортировать app.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
